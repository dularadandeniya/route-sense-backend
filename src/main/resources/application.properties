spring.application.name=RouteSense

# Connect to the Docker Database
spring.datasource.url=jdbc:postgresql://localhost:5432/routesense_db
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# Auto-create tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Security Configuration
routesense.app.jwtSecret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

# routesense.app.jwtExpirationMs=86400000 // 24 HRS
routesense.app.jwtExpirationMs=600000

# Map box API key
mapbox.token=${MAPBOX_TOKEN}

# values
routesense.app.fuel.diesel-price=277.0